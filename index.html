<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO 3i Purpleball</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <!-- HTMLのhead内にこれを書く -->
    <link rel="stylesheet" href="style.css">
　　
　　　<style>
        /* bodyの設定を「縦に並べる」ように変更 */
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; /* 縦に並べる */
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #f0f0f0; 
        }

        h1 {
            /* フォント設定 */
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            font-size: 32px;
            color: #b607f1; /* 指定のパープル */
            font-weight: bold;
            margin-bottom: 20px; /* 3Dモデルとの間に隙間を作る */
            text-align: center;
        }

        model-viewer {
            width: 80%;
            height: 60vh; /* 高さを少し調整して収まりを良くする */
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- タイトル -->
    <h1>PURPLE BALL</h1>

    <!-- 3Dモデル -->
    <model-viewer 
        src="img/text transfer sample_circle.glb" 
        ios-src="img/text transfer sample_circle.usdz"
        ar ar-modes="webxr scene-viewer quick-look"
        orientation="0deg 0deg 180deg"
        auto-rotate camera-controls 
        loading="eager">
        <div slot="poster" style="display: flex; justify-content: center; align-items: center; height: 100%;">
            <p>3Dモデルを読み込み中...</p>
        </div>
    </model-viewer>

</body>
</html>
