<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO 3i Purpleball</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; }
        model-viewer {
            width: 80%;
            height: 80%;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>PURPLE BALL</h1>

    <model-viewer 
    src="img/text transfer sample_circle.glb" 
    ios-src="img/text transfer sample_circle.usdz"
    ar ar-models="scene-viewer quick-look"
    orientation="0deg 0deg 180deg"
    auto-rotate camera-controls 
    style="background-color: #eee;" 
    loading="eager">
    <div slot="poster" style="display: flex; justify-content: center; align-items: center;">
        <p>3Dモデルを読み込み中...</p>
    </div>
</model-viewer>

</body>
</html>
